[package]
name = "hype-trigger-twap"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["howlrs <terashima@howlrs.net>"]
description = "Trigger-gated TWAP execution for Hyperliquid perps (single binary)"

[lib]
name = "hype_trigger_twap"
path = "src/lib.rs"

[[bin]]
name = "hype-twap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", features = [
    "json",
    "rustls",
    "webpki-roots",
], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
alloy = { version = "2.0.4", default-features = false, features = [
    "signer-local",
    "sol-types",
    "signers",
] }
rmp-serde = "1.3.1"
hex = "0.4.3"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
secrecy = { version = "0.10", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
fd-lock = "4.0.4"

[dev-dependencies]
mockito = "1.7.2"
# `test-util` enables tokio::time::pause / #[tokio::test(start_paused = true)],
# which the trigger and slice-deadline tests rely on for determinism.
tokio = { version = "1.52", features = ["full", "test-util"] }
# Serializes tests that mutate process-global env vars (HL_INFO_URL,
# HL_EXCHANGE_URL, HL_AGENT_PK, HL_AGENT_ADDRESS) via std::env::set_var —
# `cargo test` runs test fns concurrently on separate threads within the
# same process, and env vars are process-wide, not thread-local, so two such
# tests running at once can clobber each other's config mid-run.
serial_test = "3.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
inefficient_to_string = "warn"
redundant_clone = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
