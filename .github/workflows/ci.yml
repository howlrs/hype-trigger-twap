name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.91', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo +${{ matrix.toolchain }} fmt --check
      - run: cargo +${{ matrix.toolchain }} clippy --all-targets --all-features -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --all-targets --locked
      - run: cargo +${{ matrix.toolchain }} build --release --locked
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - run: bash tests/scripts_integration.sh
